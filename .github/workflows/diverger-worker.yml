name: diverger-worker
run-name: diverger-worker ${{ inputs.task }} ${{ inputs.run }}

# Worker de una tarea del plan (EN-EJE-02, contrato del ADR 0016 del harness). Lo lanza el bucle
# desatendido con un workflow_dispatch en la rama base, una vez por tarea. Éxito: el job termina con
# una PR abierta desde diverger/<iniciativa>/<tarea> que marca la tarea como hecha. Fallo: termina
# sin PR y su resumen dice por qué.
#
# Lo que el worker no tiene (RQ.034): credenciales de despliegue, el token del bucle ni permiso para
# lanzar otros workers. El modelo trabaja sin ningún token de GitHub: la rama, el commit y la PR los
# hace el job después, con un token de la GitHub App diverger-harness que solo puede escribir
# contenido y PR.
#
# Telemetría (ADR 0007 del harness): si el repositorio tiene GCP_WIF_PROVIDER y GCP_TELEMETRY_SA, el
# job arranca un OpenTelemetry Collector en el runner con la cuenta diverger-telemetry, que solo
# escribe logs y métricas. Para eso tiene id-token: write. En GCP, esa cuenta solo la aceptan este
# workflow, worker-humo.yml y diverger-bucle.yml, y la de despliegue solo el environment staging, que
# este job no usa: con su token, el worker no puede desplegar.
#
# El modelo construye la tarea con la skill implement de diverger-dev (EN-FM-02), sin Bash. Las
# comprobaciones del proyecto (npm run check) las ejecuta el job en otro paso, sin la clave de Anthropic;
# si fallan, el modelo sigue en la misma sesión con su salida, hasta tres intentos (EN-EJE-03). Con las
# comprobaciones en verde, el job marca la tarea como hecha y abre la PR.
#
# Escalera de reintentos (ADR 0029 del harness): si la tarea ya falló, el bucle lanza otro job con attempt (2 o 3) y
# previous (el job anterior). Este job lee el diagnóstico que dejó el anterior (artefacto diverger-diagnostico) y se lo
# da al modelo: en el 2, para empezar de cero; en el 3, para replanificar dentro de la tarea. Cada job deja siempre su
# diagnóstico, con el del anterior dentro.
#
# Las comprobaciones ejecutan código del modelo: corren en un contenedor que solo ve el worktree (harness#497). Lo
# que pasa a los pasos con la clave (el tope, el coste, la ruta de Claude Code) va por salidas de pasos, no por
# GITHUB_ENV ni GITHUB_PATH.

on:
  workflow_dispatch:
    inputs:
      initiative:
        description: Iniciativa (carpeta de .diverger/)
        required: true
        type: string
      task:
        description: Tarea (fichero de .diverger/<iniciativa>/tasks/)
        required: true
        type: string
      max-usd:
        description: Tope de gasto del job en USD; lo fija el bucle desde budget.maxWorkerUsd
        required: false
        type: string
      run:
        description: Identificador de la ejecución del bucle
        required: true
        type: string
      attempt:
        description: Intento del bucle para esta tarea (1, 2 o 3); lo fija el bucle (ADR 0029 del harness)
        required: false
        type: string
        default: "1"
      previous:
        description: Job del intento anterior, del que se lee el diagnóstico; vacío en el primero
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Dos workers nunca trabajan a la vez en la misma tarea.
concurrency:
  group: diverger-worker-${{ inputs.initiative }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # Solo para saber quién lanzó la ejecución (EN-OPS-06).
      id-token: write # Solo para la cuenta de telemetría (ADR 0007).
    env:
      INICIATIVA: ${{ inputs.initiative }}
      TAREA: ${{ inputs.task }}
      EJECUCION: ${{ inputs.run }}
      INTENTO_BUCLE: ${{ inputs.attempt || '1' }}
      PREVIO: ${{ inputs.previous || '' }}
      # Modelo del rol Desarrollador: models.developer de .diverger/settings.json manda; si no está, la
      # variable del repositorio y, si tampoco, el valor por defecto (RQ.040).
      MODELO_VARIABLE: ${{ vars.DIVERGER_WORKER_MODEL || '' }}
      MODELO_POR_DEFECTO: claude-sonnet-5-5
      # Topes: los turnos son de cada intento y el gasto, del job entero (ADR 0024). Manda el que pasa el bucle,
      # que sale de budget.maxWorkerUsd de .diverger/settings.json.
      MAX_TURNOS: ${{ vars.DIVERGER_WORKER_MAX_TURNS || '40' }}
      MAX_USD: ${{ inputs.max-usd || vars.DIVERGER_WORKER_MAX_BUDGET_USD || '10.00' }}
      # Rama del harness de la que se descarga el plugin diverger-dev.
      HARNESS_REF: ${{ vars.DIVERGER_HARNESS_REF || 'main' }}
      # Telemetría: solo si el repositorio tiene las dos variables.
      TELEMETRIA: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_TELEMETRY_SA != '' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      COLLECTOR_IMAGE: us-docker.pkg.dev/cloud-ops-agents-artifacts/google-cloud-opentelemetry-collector/otelcol-google:0.163.1
      # Imagen de las comprobaciones (npm run check), fija por su digest: la misma versión mayor de Node que setup-node.
      IMAGEN_COMPROBACIONES: node:22.23.4-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
      # Todos los git del job, sin fsmonitor ni hooks del repositorio: esta configuración manda sobre la del worktree,
      # que el código de las comprobaciones podría haber cambiado (harness#81).
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.fsmonitor
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.hooksPath
      GIT_CONFIG_VALUE_1: /dev/null
    steps:
      # Las entradas llegan de fuera: se comprueban antes de usarlas y nunca se pegan en un script.
      - name: Comprobar las entradas
        run: |
          fallar() { printf '%s\n' "$1" > "$RUNNER_TEMP/motivo"; echo "::error::$1"; exit 1; }
          [[ "$INICIATIVA" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || fallar "La iniciativa «$INICIATIVA» no es válida"
          # diverger/reinicio/… y diverger/ajustes/… son las ramas de mantenimiento del harness (harness#528).
          [[ "$INICIATIVA" != reinicio && "$INICIATIVA" != ajustes ]] || fallar "La iniciativa «$INICIATIVA» no se admite: sus ramas son las de mantenimiento del kit de evaluación del harness"
          [[ "$TAREA" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ && "$TAREA" != *.json ]] || fallar "La tarea «$TAREA» no es válida"
          [[ "$EJECUCION" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || fallar "La ejecución «$EJECUCION» no es válida"
          [[ "${INTENTO_BUCLE:-1}" =~ ^[1-3]$ ]] || fallar "El intento «$INTENTO_BUCLE» no es válido: tiene que ser 1, 2 o 3"
          [[ "${PREVIO:-}" =~ ^([0-9]{1,20})?$ ]] || fallar "El job anterior «$PREVIO» no es válido"
          [[ "$HARNESS_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || fallar "DIVERGER_HARNESS_REF no es válida"
          [[ "$MAX_TURNOS" =~ ^[1-9][0-9]{0,2}$ ]] || fallar "DIVERGER_WORKER_MAX_TURNS tiene que ser un entero entre 1 y 999"
          [[ "$MAX_USD" =~ ^[0-9]{1,3}(\.[0-9]{1,2})?$ ]] || fallar "DIVERGER_WORKER_MAX_BUDGET_USD tiene que ser un importe en USD, como 0.50"
          echo "RAMA=diverger/$INICIATIVA/$TAREA" >> "$GITHUB_ENV"
          echo "FICHERO_TAREA=.diverger/$INICIATIVA/tasks/$TAREA.json" >> "$GITHUB_ENV"
          echo "WORKTREE=$RUNNER_TEMP/worktree" >> "$GITHUB_ENV"
          echo "PLUGIN_DEV=$GITHUB_WORKSPACE/.diverger-dev/plugins/diverger-dev" >> "$GITHUB_ENV"
          echo "PLUGIN_QUALITY=$GITHUB_WORKSPACE/.diverger-dev/plugins/diverger-quality" >> "$GITHUB_ENV"

      # Sin credenciales guardadas en .git: ni el modelo ni lo que deje en el repositorio pueden empujar.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar la tarea
        run: |
          fallar() { printf '%s\n' "$1" > "$RUNNER_TEMP/motivo"; echo "::error::$1"; exit 1; }
          [ -f "$FICHERO_TAREA" ] || fallar "No existe $FICHERO_TAREA en $GITHUB_REF_NAME"
          jq -e . "$FICHERO_TAREA" >/dev/null 2>&1 || fallar "$FICHERO_TAREA no es JSON válido"
          [ "$(jq -r .id "$FICHERO_TAREA")" = "$TAREA" ] || fallar "El id de $FICHERO_TAREA no es $TAREA"
          estado=$(jq -r .status "$FICHERO_TAREA")
          [ "$estado" = pending ] || fallar "La tarea $TAREA no está pendiente en $GITHUB_REF_NAME (status: $estado)"
          # Sus dependencias tienen que estar en el plan y hechas (EN-FM-02): si no, no arranca.
          carpeta=$(dirname "$FICHERO_TAREA")
          while IFS= read -r dependencia; do
            [ -n "$dependencia" ] || continue
            [[ "$dependencia" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || fallar "La tarea $TAREA tiene una dependencia no válida"
            [ -f "$carpeta/$dependencia.json" ] || fallar "La tarea $TAREA depende de $dependencia, que no está en el plan"
            [ "$(jq -r .status "$carpeta/$dependencia.json")" = done ] || fallar "La tarea $TAREA depende de $dependencia, que no está hecha"
          done < <(jq -r '.dependsOn // [] | .[]' "$FICHERO_TAREA")
          # Modelo del rol Desarrollador (RQ.040): settings.json, después la variable y después el de por defecto.
          modelo=""
          if [ -f .diverger/settings.json ]; then
            modelo=$(jq -r '.models.developer // empty' .diverger/settings.json 2>/dev/null) || fallar ".diverger/settings.json no es JSON válido"
          fi
          modelo=${modelo:-${MODELO_VARIABLE:-$MODELO_POR_DEFECTO}}
          [[ "$modelo" =~ ^[a-z0-9][a-z0-9.-]{0,63}$ ]] || fallar "El modelo del rol Desarrollador «$modelo» no es válido"
          echo "MODELO=$modelo" >> "$GITHUB_ENV"
          echo "Modelo del rol Desarrollador: $modelo"

      # Cada worker trabaja en su propio worktree y su propia rama; el último paso lo elimina siempre.
      - name: Crear el worktree
        run: git worktree add -b "$RAMA" "$WORKTREE" HEAD

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Quién lanzó la ejecución (EN-OPS-06): github.actor de este job o, si lo lanzó el bucle con la identidad del
      # harness, el del bucle. Lo dice GitHub, no el modelo; el script es el de la rama base. Va antes del modelo para que
      # su telemetría lo lleve (EN-OPS-07, ADR 0047 del harness), y en las salidas del paso, que ningún otro paso cambia.
      - name: Quién lanzó la ejecución
        id: lanzador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fallar() { printf '%s\n' "$1" > "$RUNNER_TEMP/motivo"; echo "::error::$1"; exit 1; }
          persona=$(node "$GITHUB_WORKSPACE/scripts/lanzador.mjs" "$GITHUB_RUN_ID" "$INICIATIVA" 2>"$RUNNER_TEMP/lanzador") \
            || fallar "No se sabe quién lanzó la ejecución: $(cat "$RUNNER_TEMP/lanzador")"
          # El nombre ya viene sin saltos de línea (nombreSeguro de lanzador.mjs).
          jq -r '"login=\(.login)", "id=\(.id)", "nombre=\(.nombre)"' <<< "$persona" >> "$GITHUB_OUTPUT"
          echo "Lanzado por @$(jq -r .login <<< "$persona")"
      # La carpeta de Claude Code sale como salida del paso: los pasos con la clave la usan con un PATH fijo.
      - name: Instalar Claude Code
        id: claude
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.296
          echo "bin=$(npm prefix -g)/bin" >> "$GITHUB_OUTPUT"

      # Telemetría (ADR 0007). La cuenta de telemetría solo escribe logs y métricas; la configuración
      # del Collector y del exportador sale del checkout de la rama base, no del worktree del modelo.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: env.TELEMETRIA == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TELEMETRY_SA }}

      - name: Arrancar el Collector
        if: env.TELEMETRIA == 'true'
        run: |
          fallar() { printf '%s\n' "$1" > "$RUNNER_TEMP/motivo"; echo "::error::$1"; exit 1; }
          # Con el usuario del runner: el fichero de credenciales solo lo puede leer él.
          # Solo en localhost: el contenedor de las comprobaciones no llega al Collector (harness#81).
          docker run -d --name otel --user "$(id -u):$(id -g)" -p 127.0.0.1:4317:4317 -p 127.0.0.1:13133:13133 \
            -e GCP_PROJECT_ID -e GOOGLE_APPLICATION_CREDENTIALS=/credenciales.json \
            -v "$GOOGLE_APPLICATION_CREDENTIALS:/credenciales.json:ro" \
            -v "$PWD/.github/telemetria/collector.yaml:/etc/otelcol/config.yaml:ro" \
            "$COLLECTOR_IMAGE" --config=/etc/otelcol/config.yaml
          for _ in $(seq 30); do curl -sf 127.0.0.1:13133 >/dev/null && exit 0; sleep 2; done
          docker logs otel
          fallar "El Collector de la telemetría no arranca"

      # Claude Code solo lee las variables del exportador de la configuración gestionada, no del
      # repositorio. Cada ejecución lleva sus identificadores para encontrar sus eventos.
      - name: Configuración gestionada
        if: env.TELEMETRIA == 'true'
        env:
          LANZADO_POR: ${{ steps.lanzador.outputs.login }}
        run: |
          atributos="github.run_id=$GITHUB_RUN_ID,github.repository=$GITHUB_REPOSITORY,diverger.task=$TAREA,diverger.run=$EJECUCION"
          atributos+=",diverger.lanzado_por=$LANZADO_POR"
          sudo mkdir -p /etc/claude-code
          jq --arg a "$atributos" '.env.OTEL_RESOURCE_ATTRIBUTES = $a' .github/telemetria/managed-settings.json \
            | sudo tee /etc/claude-code/managed-settings.json >/dev/null
          echo "Telemetría en BigQuery con github.run_id=$GITHUB_RUN_ID"

      # Los plugins diverger-dev y diverger-quality (el del Auditor de seguridad) se descargan del harness, que es
      # privado, con un token de la App que solo puede leer su contenido. El token se pide y se usa en estos dos pasos,
      # antes del modelo, y no llega a su entorno; los plugins quedan fuera del worktree, donde el modelo no puede escribir.
      - name: Token de lectura de diverger-dev
        id: token-dev
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DIVERGER_HARNESS_APP_ID }}
          private-key: ${{ secrets.DIVERGER_HARNESS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Diverger-ExP-Harness
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Diverger-ExP-Harness
          ref: ${{ env.HARNESS_REF }}
          token: ${{ steps.token-dev.outputs.token }}
          path: .diverger-dev
          persist-credentials: false
          sparse-checkout: |
            plugins/diverger-dev
            plugins/diverger-quality

      # Tres intentos como mucho. En cada uno, el modelo trabaja (worker-modelo.sh) y después el job
      # ejecuta las comprobaciones en otro paso, sin la clave de Anthropic (worker-comprobar.sh). Los
      # scripts salen del checkout de la rama base, no del worktree que cambia el modelo.
      # max-usd solo puede bajar el tope: el techo es budget.maxWorkerUsd de la rama base, que protege CODEOWNERS.
      # Va como salida del paso, no en GITHUB_ENV (harness#497).
      - name: Tope del job
        id: tope
        run: |
          techo=$(jq -r '.budget.maxWorkerUsd // 10' .diverger/settings.json 2>/dev/null || echo 10)
          # Lo mismo que hace el bucle: un valor que el worker no puede usar vale 10, no 0.
          awk -v techo="$techo" 'BEGIN { exit !(techo ~ /^[0-9]+(\.[0-9]+)?$/ && techo + 0 >= 0.5 && techo + 0 < 1000) }' || techo=10
          awk -v tope="$MAX_USD" -v techo="$techo" 'BEGIN { printf "tope=%.2f\n", (tope + 0 < techo + 0 ? tope : techo) }' >> "$GITHUB_OUTPUT"
      # El diagnóstico del intento anterior. previous lo pone el bucle, y solo con un job que listó como worker de
      # esta tarea (gh run list -w diverger-worker.yml, con el título de la tarea). El token va en with:, como el del
      # plugin, nunca en env. Si no se puede leer, el intento sigue sin él.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.INTENTO_BUCLE != '1' && env.PREVIO != ''
        continue-on-error: true
        with:
          name: diverger-diagnostico
          run-id: ${{ env.PREVIO }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/anterior
      - name: Diagnóstico del intento anterior
        if: env.INTENTO_BUCLE != '1' && env.PREVIO != ''
        run: |
          head -c 12000 "$RUNNER_TEMP/anterior/diagnostico.md" > "$RUNNER_TEMP/diagnostico-anterior.md" 2>/dev/null \
            || { echo "::warning::El job $PREVIO no dejó diagnóstico: el intento $INTENTO_BUCLE sigue sin él"; exit 0; }
          echo "Diagnóstico del job $PREVIO, para el intento $INTENTO_BUCLE:"
          # Lo escribieron el modelo y su código: sin órdenes de workflow mientras se imprime (harness#81).
          fin="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$fin"
          cat "$RUNNER_TEMP/diagnostico-anterior.md"
          echo "::$fin::"

      - name: Worker
        id: worker-1
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          TOPE_JOB: ${{ steps.tope.outputs.tope }}
          CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
          BASH_ENV: ""
          ENV: ""
        working-directory: ${{ env.WORKTREE }}
        run: bash "$GITHUB_WORKSPACE/.github/diverger/worker-modelo.sh" 1
      - name: Comprobaciones
        id: comprobaciones-1
        continue-on-error: true
        timeout-minutes: 15
        run: bash .github/diverger/worker-comprobar.sh 1
      # El Auditor de seguridad revisa el cambio si las comprobaciones están en verde (HU-CAL-01 del harness, ADR 0040).
      # Con «bloquear» sale con 1 y se lanza el intento siguiente con su explotación; sin veredicto, la tarea no pasa.
      - name: Auditor de seguridad
        id: auditor-1
        if: steps.comprobaciones-1.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GASTADO: ${{ steps.worker-1.outputs.coste }}
          COSTES_AUDITOR: ""
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          TOPE_JOB: ${{ steps.tope.outputs.tope }}
          CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
          BASH_ENV: ""
          ENV: ""
        working-directory: ${{ env.WORKTREE }}
        run: bash "$GITHUB_WORKSPACE/.github/diverger/worker-auditor.sh" 1

      - name: Worker, intento 2
        id: worker-2
        if: steps.comprobaciones-1.outcome == 'failure' || steps.auditor-1.outputs.veredicto == 'bloquear'
        timeout-minutes: 20
        env:
          GASTADO: ${{ steps.worker-1.outputs.coste }}
          COSTES_AUDITOR: "${{ steps.auditor-1.outputs.coste }}"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          TOPE_JOB: ${{ steps.tope.outputs.tope }}
          CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
          BASH_ENV: ""
          ENV: ""
        working-directory: ${{ env.WORKTREE }}
        run: bash "$GITHUB_WORKSPACE/.github/diverger/worker-modelo.sh" 2
      - name: Comprobaciones, intento 2
        id: comprobaciones-2
        if: steps.comprobaciones-1.outcome == 'failure' || steps.auditor-1.outputs.veredicto == 'bloquear'
        continue-on-error: true
        timeout-minutes: 15
        run: bash .github/diverger/worker-comprobar.sh 2
      # El Auditor de seguridad revisa el cambio si las comprobaciones están en verde (HU-CAL-01 del harness, ADR 0040).
      # Con «bloquear» sale con 1 y se lanza el intento siguiente con su explotación; sin veredicto, la tarea no pasa.
      - name: Auditor de seguridad, intento 2
        id: auditor-2
        if: steps.comprobaciones-2.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GASTADO: ${{ steps.worker-2.outputs.coste }}
          COSTES_AUDITOR: "${{ steps.auditor-1.outputs.coste }}"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          TOPE_JOB: ${{ steps.tope.outputs.tope }}
          CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
          BASH_ENV: ""
          ENV: ""
        working-directory: ${{ env.WORKTREE }}
        run: bash "$GITHUB_WORKSPACE/.github/diverger/worker-auditor.sh" 2

      - name: Worker, intento 3
        id: worker-3
        if: steps.comprobaciones-2.outcome == 'failure' || steps.auditor-2.outputs.veredicto == 'bloquear'
        timeout-minutes: 20
        env:
          GASTADO: ${{ steps.worker-2.outputs.coste || steps.worker-1.outputs.coste }}
          COSTES_AUDITOR: "${{ steps.auditor-1.outputs.coste }} ${{ steps.auditor-2.outputs.coste }}"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          TOPE_JOB: ${{ steps.tope.outputs.tope }}
          CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
          BASH_ENV: ""
          ENV: ""
        working-directory: ${{ env.WORKTREE }}
        run: bash "$GITHUB_WORKSPACE/.github/diverger/worker-modelo.sh" 3
      - name: Comprobaciones, intento 3
        id: comprobaciones-3
        if: steps.comprobaciones-2.outcome == 'failure' || steps.auditor-2.outputs.veredicto == 'bloquear'
        continue-on-error: true
        timeout-minutes: 15
        run: bash .github/diverger/worker-comprobar.sh 3
      # El Auditor de seguridad revisa el cambio si las comprobaciones están en verde (HU-CAL-01 del harness, ADR 0040).
      # Con «bloquear» sale con 1 y se lanza el intento siguiente con su explotación; sin veredicto, la tarea no pasa.
      - name: Auditor de seguridad, intento 3
        id: auditor-3
        if: steps.comprobaciones-3.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GASTADO: ${{ steps.worker-3.outputs.coste }}
          COSTES_AUDITOR: "${{ steps.auditor-1.outputs.coste }} ${{ steps.auditor-2.outputs.coste }}"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          TOPE_JOB: ${{ steps.tope.outputs.tope }}
          CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
          BASH_ENV: ""
          ENV: ""
        working-directory: ${{ env.WORKTREE }}
        run: bash "$GITHUB_WORKSPACE/.github/diverger/worker-auditor.sh" 3

      # Lo que el job acepta del worker: comprobaciones en verde, algún cambio y ninguno en el plan ni en los
      # workflows. Entonces es el job, no el modelo, quien marca la tarea como hecha. Sin cambios solo se acepta si el
      # modelo dijo con «YA-CUBIERTA:» que otra tarea ya la hizo (harness#538): la PR solo marca la tarea, con el
      # motivo, y la revisión y la política de aprobación deciden.
      - name: Comprobar el resultado
        working-directory: ${{ env.WORKTREE }}
        run: |
          fallar() { printf '%s\n' "$1" > "$RUNNER_TEMP/motivo"; echo "::error::$1"; exit 1; }
          # El veredicto del Auditor de seguridad del último intento (worker-modelo.sh lo borra al empezar cada uno).
          auditor=$(cat "$RUNNER_TEMP/auditor" 2>/dev/null || echo ninguno)
          [ "$auditor" != bloquear ] \
            || fallar "El Auditor de seguridad sigue bloqueando el cambio después de 3 intentos: hay un fallo explotable"
          [ "$(cat "$RUNNER_TEMP/comprobaciones" 2>/dev/null)" = verde ] \
            || fallar "Las comprobaciones (npm run check) siguen en rojo después de 3 intentos"
          [ "$auditor" = comentar ] \
            || fallar "Sin veredicto del Auditor de seguridad: $(cat "$RUNNER_TEMP/motivo-auditor" 2>/dev/null || echo "no se ha ejecutado")"
          git add -A
          if git diff --cached --quiet; then
            [ -s "$RUNNER_TEMP/cubierta" ] || fallar "El worker no ha cambiado nada"
            cp "$RUNNER_TEMP/cubierta" "$RUNNER_TEMP/solo-marca"
          fi
          plan=$(git diff --cached --name-only -- .diverger/)
          [ -z "$plan" ] || fallar "El worker ha cambiado el plan: $plan"
          # Solo las rutas que el modelo puede escribir (--allowedTools de worker-modelo.sh). Lo demás solo lo ha
          # podido cambiar el código de las comprobaciones, y no entra en la PR (harness#81).
          cambiados=$(git diff --cached --name-only)
          fuera=$(grep -Ev '^(src/|web/|app/contextos\.ts$)' <<< "$cambiados" || true)
          [ -z "$fuera" ] || fallar "El worker ha cambiado rutas fuera de src/, web/ y app/contextos.ts: ${fuera//$'\n'/ }"
          # Los fallos que el worker corrigió van en la tarea, como hace finish_worker en el modo interactivo
          # (HU-NUC-20, harness#675): los caracteres de control pasan a espacios, cada frase se recorta a 300
          # caracteres, sin repetir, y se quedan las tres primeras. Así la sesión de /diverger:run los compara.
          [ -f "$RUNNER_TEMP/fallos" ] || : > "$RUNNER_TEMP/fallos"
          jq --rawfile f "$RUNNER_TEMP/fallos" '
            ([$f | split("\n")[] | sub("^(FALLO|FAILURE):"; "") | gsub("[[:cntrl:]]"; " ") | gsub(" +"; " ")
              | sub("^ "; "") | sub(" $"; "") | select(length > 0)
              | if length > 300 then (.[0:299] | sub(" +$"; "")) + "…" else . end]
              | reduce .[] as $x ([]; if index([$x]) then . else . + [$x] end) | .[0:3]) as $fallos
            | .status = "done" | if ($fallos | length) > 0 then .failures = $fallos else . end' \
            "$FICHERO_TAREA" > "$RUNNER_TEMP/tarea.json"
          cp "$RUNNER_TEMP/tarea.json" "$FICHERO_TAREA"
          git add "$FICHERO_TAREA"
          git diff --cached --stat

      # El token se pide después del worker, así que el modelo nunca lo tiene. Solo contenido y PR:
      # sin Actions (no lanza otros workers) ni Workflows.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.DIVERGER_HARNESS_APP_ID }}
          private-key: ${{ secrets.DIVERGER_HARNESS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # Sin hooks del repositorio: el commit y el push no ejecutan nada que el worker haya podido dejar.
      - name: Commit con los trailers
        working-directory: ${{ env.WORKTREE }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.token.outputs.app-slug }}
          # Del paso «Quién lanzó la ejecución».
          LANZADO_POR: ${{ steps.lanzador.outputs.login }}
          LANZADO_POR_ID: ${{ steps.lanzador.outputs.id }}
          LANZADO_POR_NOMBRE: ${{ steps.lanzador.outputs.nombre }}
        run: |
          fallar() { printf '%s\n' "$1" > "$RUNNER_TEMP/motivo"; echo "::error::$1"; exit 1; }
          id=$(gh api "users/$APP%5Bbot%5D" -q .id) || fallar "No se encuentra el usuario de la App $APP"
          titulo=$(jq -r .title "$FICHERO_TAREA")
          tipo=feat
          [ ! -s "$RUNNER_TEMP/solo-marca" ] || tipo=chore  # Solo marca la tarea (harness#538).
          git -c core.hooksPath=/dev/null \
            -c user.name="$APP[bot]" -c user.email="$id+$APP[bot]@users.noreply.github.com" \
            commit --quiet -m "$tipo: $TAREA $titulo" \
            --trailer "Diverger-Rol: Desarrollador" \
            --trailer "Diverger-Modelo: $MODELO" \
            --trailer "Diverger-Tarea: $TAREA" \
            --trailer "Diverger-Iniciado-por: $LANZADO_POR" \
            --trailer "Co-authored-by: $LANZADO_POR_NOMBRE <$LANZADO_POR_ID+$LANZADO_POR@users.noreply.github.com>"
          git log -1 --format=%B

      - name: Rama y PR
        working-directory: ${{ env.WORKTREE }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LANZADO_POR: ${{ steps.lanzador.outputs.login }}
        run: |
          fallar() { printf '%s\n' "$1" > "$RUNNER_TEMP/motivo"; echo "::error::$1"; exit 1; }
          repo="$GITHUB_REPOSITORY"
          abiertas=$(gh pr list -R "$repo" --head "$RAMA" --state open --json url -q '.[].url')
          [ -z "$abiertas" ] || fallar "Ya hay una PR abierta desde $RAMA: $abiertas"
          # Un intento anterior fallido puede haber dejado la rama: se sustituye.
          git -c core.hooksPath=/dev/null push --quiet --force \
            "https://x-access-token:$GH_TOKEN@github.com/$repo.git" "HEAD:refs/heads/$RAMA" \
            || fallar "GitHub ha rechazado el push de $RAMA"
          titulo=$(jq -r .title "$FICHERO_TAREA")
          {
            echo "<!-- diverger:task=$TAREA;run=$EJECUCION -->"
            echo "Tarea **$TAREA** de la iniciativa \`$INICIATIVA\`, ejecución \`$EJECUCION\`."
            echo
            echo "Lanzado por @$LANZADO_POR. Job del worker: $GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -s "$RUNNER_TEMP/solo-marca" ]; then
              echo "**Solo marca la tarea como hecha.** El worker no ha cambiado código porque dice que otra tarea ya la cubre. Revisa que sea así antes de integrarla:"
              echo
              printf '> %s\n' "$(cat "$RUNNER_TEMP/solo-marca")"
              echo
            fi
            jq -rs --arg modelo "$MODELO" \
              '"Coste del worker: \(map(.total_cost_usd // 0) | max) USD en \(map(.num_turns // 0) | add) turnos y \(length) intentos (modelo `\($modelo)`). Comprobaciones (npm run check) en verde."' \
              "$RUNNER_TEMP"/salida-*.json
            ultimo=$(ls "$RUNNER_TEMP"/auditor-*.md 2>/dev/null | sort | tail -n 1)
            if [ -n "$ultimo" ]; then
              echo
              cat "$ultimo"
            fi
          } > "$RUNNER_TEMP/pr.md"
          url=$(gh pr create -R "$repo" --base "$GITHUB_REF_NAME" --head "$RAMA" \
            --title "[$TAREA] $titulo" --body-file "$RUNNER_TEMP/pr.md") || fallar "No se ha podido abrir la PR desde $RAMA"
          echo "$url" > "$RUNNER_TEMP/pr"
          echo "PR abierta: $url"
          # Auto-merge siempre: GitHub la integra cuando se cumplen las reglas de main. La política de
          # aprobación del ruleset decide si espera a una persona (ADR 0008 y 0016 del harness), así que
          # vale en yolo y en checkpoints. Si el repositorio no lo permite, la PR queda abierta y el bucle
          # espera a que alguien la integre.
          if gh pr merge "$url" -R "$repo" --auto --merge --delete-branch; then
            echo "auto" > "$RUNNER_TEMP/integracion"
            echo "Auto-merge activado: se integra cuando pasen las comprobaciones y, si el ruleset lo pide, la aprobación"
          else
            echo "manual" > "$RUNNER_TEMP/integracion"
            echo "::warning::No se ha podido activar el auto-merge (¿«Allow auto-merge» desactivado?): alguien tiene que integrar $url"
          fi

      # El diagnóstico para el intento siguiente (ADR 0029 del harness): siempre, también si el job falla. Lleva el del
      # intento anterior dentro, así que el tercero ve los dos.
      - name: Diagnóstico para el intento siguiente
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostico"
          {
            echo "## Intento $INTENTO_BUCLE del bucle (job $GITHUB_RUN_ID)"
            echo
            echo "**Motivo:** $(cat "$RUNNER_TEMP/motivo" 2>/dev/null || echo "sin motivo; mira el log del job")"
            # Sin ningún log (el job paró antes de las comprobaciones), ls falla: no debe tumbar el diagnóstico.
            ultimo=$(ls "$RUNNER_TEMP"/comprobaciones-*.log 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "$ultimo" ]; then
              echo
              echo "**Final de las últimas comprobaciones (npm run check):**"
              echo '```'
              tail -n 60 "$ultimo"
              echo '```'
            fi
            if [ "$(cat "$RUNNER_TEMP/auditor" 2>/dev/null)" = bloquear ]; then
              echo
              cat "$(ls "$RUNNER_TEMP"/auditor-*.md | sort | tail -n 1)"
            fi
            if [ -s "$RUNNER_TEMP/salida.json" ]; then
              echo
              echo "**Final de la respuesta del modelo:**"
              jq -r '.result // ""' "$RUNNER_TEMP/salida.json" 2>/dev/null | tail -n 30
            fi
            if [ -s "$RUNNER_TEMP/diagnostico-anterior.md" ]; then
              echo
              cat "$RUNNER_TEMP/diagnostico-anterior.md"
            fi
          } | head -c 12000 > "$RUNNER_TEMP/diagnostico/diagnostico.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diverger-diagnostico
          path: ${{ runner.temp }}/diagnostico/diagnostico.md
          if-no-files-found: ignore
          retention-days: 30

      # El coste para el bucle: también si el job falla o se cancela. Sin artefacto, cuenta el tope entero. Sale de
      # las salidas de los pasos del modelo y del Auditor, que el código de las comprobaciones no puede cambiar.
      - name: Coste del job
        if: always()
        env:
          INTENTOS: >-
            ${{ steps.worker-1.outcome }}:${{ steps.worker-1.outputs.coste }}
            ${{ steps.worker-2.outcome }}:${{ steps.worker-2.outputs.coste }}
            ${{ steps.worker-3.outcome }}:${{ steps.worker-3.outputs.coste }}
          AUDITORES: >-
            ${{ steps.auditor-1.outcome }}:${{ steps.auditor-1.outputs.coste }}
            ${{ steps.auditor-2.outcome }}:${{ steps.auditor-2.outputs.coste }}
            ${{ steps.auditor-3.outcome }}:${{ steps.auditor-3.outputs.coste }}
        run: bash .github/diverger/worker-coste.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diverger-coste
          path: ${{ runner.temp }}/coste/coste.json
          if-no-files-found: ignore
          retention-days: 30

      # Parar el Collector con margen manda lo que tenga pendiente. Corre siempre, también si el job
      # falla o se salta la telemetría (entonces no hay Collector y no hace nada).
      - name: Parar el Collector
        if: always()
        run: |
          docker inspect otel >/dev/null 2>&1 || { echo "Sin Collector: no hay telemetría que mandar"; exit 0; }
          sleep 10
          docker stop -t 30 otel
          docker logs otel 2>&1 | tail -40
          echo "Telemetría en BigQuery con github.run_id=$GITHUB_RUN_ID"

      - name: Eliminar el worktree
        if: always()
        run: |
          git rev-parse --git-dir >/dev/null 2>&1 || exit 0  # Sin checkout no hay worktree.
          [ ! -e "$WORKTREE" ] || git worktree remove --force "$WORKTREE"
          git worktree prune
          git worktree list
          test ! -e "$WORKTREE"
          echo "Worktree eliminado: $WORKTREE"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## diverger-worker $TAREA $EJECUCION"
            if [ -s "$RUNNER_TEMP/pr" ]; then
              echo "**Resultado:** PR abierta, $(cat "$RUNNER_TEMP/pr")"
              if [ "$(cat "$RUNNER_TEMP/integracion" 2>/dev/null)" = auto ]; then
                echo "Se integrará sola cuando se cumplan las reglas de la rama base (auto-merge)."
              else
                echo "Sin auto-merge: alguien tiene que integrarla."
              fi
            elif [ -s "$RUNNER_TEMP/motivo" ]; then
              echo "**Resultado:** sin PR. $(cat "$RUNNER_TEMP/motivo")"
            else
              echo "**Resultado:** sin PR. El job se canceló, superó su tiempo máximo o falló un paso sin motivo propio; mira su log."
            fi
            if ls "$RUNNER_TEMP"/salida-*.json >/dev/null 2>&1; then
              jq -rs '"", "Coste: \(map(.total_cost_usd // 0) | max) USD, \(map(.num_turns // 0) | add) turnos en \(length) intentos, final: \(.[-1].subtype)."' "$RUNNER_TEMP"/salida-*.json
              jq -rs '"", "Herramientas denegadas: \(map(.permission_denials // [] | length) | add)", (.[].permission_denials[]? | "- \(.tool_name)")' "$RUNNER_TEMP"/salida-*.json
            fi
            if [ -s "$RUNNER_TEMP/comprobaciones" ]; then
              printf '\nComprobaciones (npm run check): %s.\n' "$(cat "$RUNNER_TEMP/comprobaciones")"
            fi
            if [ "$TELEMETRIA" = true ]; then
              printf '\nTelemetría en BigQuery con github.run_id=%s.\n' "$GITHUB_RUN_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
