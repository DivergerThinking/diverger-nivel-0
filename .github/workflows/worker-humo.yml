name: worker-humo

# Prueba de humo de EN-S0-01: un worker se autentica con la clave del secreto ANTHROPIC_API_KEY
# y el gasto aparece en el workspace con límite mensual. Se lanza a mano y cuesta céntimos.
# Va en .github/workflows/ de diverger-nivel-0 (infra/entornos/LEEME.md).

on:
  workflow_dispatch:
    inputs:
      prueba:
        description: Qué se comprueba
        type: choice
        options: [todo, worker, gcp, telemetria, telemetria-repo, identidad, codeowners]
        default: todo
      dejar-abierta:
        description: Con «identidad» o «codeowners», deja abierta la PR de prueba para aprobarla a mano
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  worker:
    if: inputs.prueba == 'todo' || inputs.prueba == 'worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      # Sin herramientas permitidas y en modo dontAsk: el worker solo puede responder.
      - name: Worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Responde solo con la palabra OK." \
            --model claude-haiku-5-5 --permission-mode dontAsk \
            --max-turns 1 --max-budget-usd 0.10 --output-format json > salida.json
          jq '{is_error, result, total_cost_usd}' salida.json
          test "$(jq -r .is_error salida.json)" = "false"

  # El despliegue entra en GCP con un token de vida corta de Workload Identity Federation, sin
  # claves de servicio. Solo comprueba el acceso: lista los servicios de Cloud Run y las imágenes.
  gcp:
    if: inputs.prueba == 'todo' || inputs.prueba == 'gcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Acceso a GCP
        run: |
          gcloud run services list --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}"
          gcloud artifacts docker images list "${{ vars.GCP_ARTIFACT_REPO }}"

  # Telemetría de Claude Code hacia GCP (EN-TEL-01). Un Collector corre en el propio runner y entra
  # en GCP como diverger-telemetry, que solo puede escribir logs y métricas. Con «telemetria» las
  # variables del exportador van en la configuración gestionada; con «telemetria-repo», solo en el
  # .claude/settings.json del repo, que Claude Code ignora: no debe llegar ningún evento.
  telemetria:
    if: inputs.prueba == 'telemetria' || inputs.prueba == 'telemetria-repo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      COLLECTOR_IMAGE: us-docker.pkg.dev/cloud-ops-agents-artifacts/google-cloud-opentelemetry-collector/otelcol-google:0.163.1
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TELEMETRY_SA }}
      - name: Arrancar el Collector
        run: |
          # Con el usuario del runner: el fichero de credenciales solo lo puede leer él.
          docker run -d --name otel --user "$(id -u):$(id -g)" -p 4317:4317 -p 13133:13133 \
            -e GCP_PROJECT_ID -e GOOGLE_APPLICATION_CREDENTIALS=/credenciales.json \
            -v "$GOOGLE_APPLICATION_CREDENTIALS:/credenciales.json:ro" \
            -v "$PWD/.github/telemetria/collector.yaml:/etc/otelcol/config.yaml:ro" \
            "$COLLECTOR_IMAGE" --config=/etc/otelcol/config.yaml
          for i in $(seq 30); do curl -sf localhost:13133 >/dev/null && exit 0; sleep 2; done
          docker logs otel; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      # Cada ejecución lleva su identificador en los atributos, para encontrar sus eventos.
      - name: Variables del exportador
        env:
          PRUEBA: ${{ inputs.prueba }}
        run: |
          atributos="diverger.prueba=$PRUEBA,github.run_id=$GITHUB_RUN_ID,github.repository=$GITHUB_REPOSITORY"
          ajustes="$(jq --arg a "$atributos" '.env.OTEL_RESOURCE_ATTRIBUTES = $a' .github/telemetria/managed-settings.json)"
          if [ "$PRUEBA" = telemetria ]; then
            sudo mkdir -p /etc/claude-code
            echo "$ajustes" | sudo tee /etc/claude-code/managed-settings.json >/dev/null
          else
            mkdir -p .claude
            echo "$ajustes" > .claude/settings.json
          fi
      - name: Worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Responde solo con la palabra OK." \
            --model claude-haiku-5-5 --permission-mode dontAsk \
            --max-turns 1 --max-budget-usd 0.10 --output-format json > salida.json
          jq '{is_error, result, total_cost_usd, session_id}' salida.json
          test "$(jq -r .is_error salida.json)" = "false"
      # Parar el Collector con margen manda lo que tenga pendiente.
      - name: Vaciar el Collector
        if: always()
        run: |
          sleep 10
          docker stop -t 30 otel
          docker logs otel 2>&1 | tail -40
          echo "Buscar en BigQuery por github.run_id=$GITHUB_RUN_ID"

  # Identidad del harness en GitHub (EN-OPS-05, ADR 0008). Con un token de vida corta de la GitHub App
  # diverger-harness, abre una PR que tiene que salir como diverger-harness[bot] e intenta aprobarla
  # con ese mismo token: GitHub tiene que rechazarlo. Sin «dejar-abierta», cierra la PR al terminar.
  identidad:
    if: inputs.prueba == 'identidad'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.DIVERGER_HARNESS_APP_ID }}
          private-key: ${{ secrets.DIVERGER_HARNESS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: PR abierta por la identidad del harness
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LANZADO_POR: ${{ github.actor }}
          DEJAR_ABIERTA: ${{ inputs.dejar-abierta }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          rama="prueba/identidad-$GITHUB_RUN_ID"
          base=$(gh api "repos/$repo/git/ref/heads/main" -q .object.sha)
          gh api "repos/$repo/git/refs" -f ref="refs/heads/$rama" -f sha="$base" >/dev/null
          contenido=$(printf 'Prueba de la identidad del harness, ejecución %s.\n' "$GITHUB_RUN_ID" | base64 -w0)
          gh api -X PUT "repos/$repo/contents/pruebas/identidad-$GITHUB_RUN_ID.md" -f branch="$rama" \
            -f message="test: identidad del harness (EN-OPS-05)" -f content="$contenido" >/dev/null
          pr=$(gh api "repos/$repo/pulls" -f head="$rama" -f base=main \
            -f title="Prueba de la identidad del harness ($GITHUB_RUN_ID)" \
            -f body="Lanzado por @$LANZADO_POR. Ejecución: $GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID" -q .number)
          autor=$(gh api "repos/$repo/pulls/$pr" -q .user.login)
          echo "PR #$pr abierta por $autor"
          test "$autor" = "diverger-harness[bot]"
          if gh api "repos/$repo/pulls/$pr/reviews" -f event=APPROVE >salida.json 2>error.txt; then
            echo "La identidad del harness ha podido aprobar su propia PR"; exit 1
          fi
          echo "Aprobación rechazada, como se espera: $(jq -r '.message + " " + ((.errors // []) | join(" "))' salida.json 2>/dev/null || cat error.txt)"
          if [ "$DEJAR_ABIERTA" != "true" ]; then
            gh api -X PATCH "repos/$repo/pulls/$pr" -f state=closed >/dev/null
            gh api -X DELETE "repos/$repo/git/refs/heads/$rama"
            echo "PR #$pr cerrada y rama borrada"
          fi

  # CODEOWNERS sobre la configuración (EN-OPS-04, ADR 0014). Con la identidad del harness, como lo
  # haría un agente: intenta cambiar el modo de «checkpoints» a «yolo» con un push directo a main,
  # que el ruleset tiene que rechazar, y después con una PR, que tiene que quedar pendiente de la
  # revisión del titular y no poder integrarse. Sin «dejar-abierta», cierra la PR al terminar.
  codeowners:
    if: inputs.prueba == 'codeowners'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.DIVERGER_HARNESS_APP_ID }}
          private-key: ${{ secrets.DIVERGER_HARNESS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Push directo y PR que cambian el modo
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LANZADO_POR: ${{ github.actor }}
          DEJAR_ABIERTA: ${{ inputs.dejar-abierta }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          fichero=.diverger/settings.json
          # GitHub valida CODEOWNERS por su cuenta: un propietario sin acceso o una línea mal escrita no protegen.
          errores=$(gh api "repos/$repo/codeowners/errors" -q '.errors | length')
          test "$errores" = 0 || { gh api "repos/$repo/codeowners/errors"; exit 1; }
          titular=$(gh api "repos/$repo/contents/.github/CODEOWNERS" -q .content | base64 -d \
            | awk -v f="/$fichero" '$1 == f { sub("^@", "", $2); print $2 }' | tail -1)
          echo "Titular de $fichero en CODEOWNERS: $titular"
          test -n "$titular"
          sha=$(gh api "repos/$repo/contents/$fichero?ref=main" -q .sha)
          gh api "repos/$repo/contents/$fichero?ref=main" -q .content | base64 -d > actual.json
          test "$(jq -r .mode actual.json)" = checkpoints
          yolo=$(jq '.mode = "yolo"' actual.json | base64 -w0)

          # Criterio negativo: el push directo a main no entra y el fichero sigue igual.
          if gh api -X PUT "repos/$repo/contents/$fichero" -f branch=main -f sha="$sha" \
            -f message="test: push directo que cambia el modo (EN-OPS-04)" -f content="$yolo" >salida.json 2>error.txt; then
            echo "El push directo a main ha entrado"; exit 1
          fi
          echo "Push directo rechazado, como se espera: $(jq -r '.message // empty' salida.json 2>/dev/null) $(cat error.txt)"
          test "$(gh api "repos/$repo/contents/$fichero?ref=main" -q .sha)" = "$sha"
          echo "$fichero sigue como estaba en main"

          # Criterio positivo: la PR queda pendiente del titular y no se puede integrar.
          rama="prueba/codeowners-$GITHUB_RUN_ID"
          base=$(gh api "repos/$repo/git/ref/heads/main" -q .object.sha)
          gh api "repos/$repo/git/refs" -f ref="refs/heads/$rama" -f sha="$base" >/dev/null
          gh api -X PUT "repos/$repo/contents/$fichero" -f branch="$rama" -f sha="$sha" \
            -f message="test: cambia el modo a yolo (EN-OPS-04)" -f content="$yolo" >/dev/null
          pr=$(gh api "repos/$repo/pulls" -f head="$rama" -f base=main \
            -f title="Prueba de CODEOWNERS: modo yolo ($GITHUB_RUN_ID)" \
            -f body="Lanzado por @$LANZADO_POR. No se integra. Ejecución: $GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID" -q .number)
          echo "PR #$pr abierta por $(gh api "repos/$repo/pulls/$pr" -q .user.login)"
          revisores=""
          for i in $(seq 20); do
            revisores=$(gh api "repos/$repo/pulls/$pr/requested_reviewers" -q '.users[].login')
            grep -qx "$titular" <<<"$revisores" && break
            sleep 3
          done
          echo "Revisión pedida a: ${revisores:-nadie}"
          grep -qx "$titular" <<<"$revisores"
          decision=$(gh pr view "$pr" -R "$repo" --json reviewDecision -q .reviewDecision)
          echo "Decisión de revisión: $decision"
          test "$decision" = REVIEW_REQUIRED
          if gh api -X PUT "repos/$repo/pulls/$pr/merge" >salida.json 2>error.txt; then
            echo "La PR se ha integrado sin la aprobación del titular"; exit 1
          fi
          echo "Integración rechazada, como se espera: $(jq -r '.message // empty' salida.json 2>/dev/null) $(cat error.txt)"
          if [ "$DEJAR_ABIERTA" != "true" ]; then
            gh api -X PATCH "repos/$repo/pulls/$pr" -f state=closed >/dev/null
            gh api -X DELETE "repos/$repo/git/refs/heads/$rama"
            echo "PR #$pr cerrada y rama borrada"
          fi
