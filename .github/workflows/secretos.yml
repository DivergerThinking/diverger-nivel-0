name: secretos

# Análisis de secretos (RQ.035: las credenciales nunca van al repo). En un PR revisa todos sus
# commits, no solo el último: un secreto añadido y borrado después sigue en el historial.
# El mismo fichero se copia tal cual a los repos que crea el harness (infra/entornos/LEEME.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # El binario y no gitleaks-action: la acción pide licencia en las cuentas de organización.
      - name: Instalar gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Analizar
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then rango="$BASE..$HEAD"; else rango="HEAD"; fi
          ./gitleaks git --no-banner --redact --verbose --exit-code 1 --log-opts="$rango" .
